<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light only">
  <meta name="theme-color" content="#f7f4ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="麻雀スコア">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <title>麻雀スコア帳</title>
  <style>
    :root {
      color-scheme: only light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--cp-bg);
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: 0;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    .shell { width: min(1180px, 100%); margin: 0 auto; padding: 24px; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 44px;
      height: 52px;
      border: 1px solid var(--cp-border-strong);
      border-radius: .625rem;
      background: var(--cp-surface);
      color: var(--cp-accent);
      font-family: Georgia, "Yu Mincho", serif;
      font-size: 25px;
      font-weight: 700;
      box-shadow: 0 0 2px var(--cp-border), 0 1px 2px var(--cp-border);
    }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 2px; font: 700 22px Georgia, "Yu Mincho", serif; }
    h2 { margin-bottom: 8px; font: 700 24px Georgia, "Yu Mincho", serif; }
    h3 { margin-bottom: 12px; font-size: 15px; }
    .muted { color: var(--cp-text-muted); }
    .eyebrow { margin-bottom: 4px; color: var(--cp-accent); font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn {
      min-height: 40px;
      padding: 8px 14px;
      border: 1px solid var(--cp-border);
      border-radius: .625rem;
      background: var(--cp-surface);
      color: var(--cp-text);
      font-weight: 650;
    }
    .btn:hover { border-color: var(--cp-border-strong); }
    .btn.primary { border-color: var(--cp-accent); background: var(--cp-accent); color: var(--cp-accent-fg); }
    .btn.primary:hover { background: var(--cp-accent-hover); }
    .btn.danger { color: var(--cp-danger); }
    .btn.icon { width: 40px; padding: 8px; font-size: 18px; line-height: 1; }
    dialog {
      width: min(520px, calc(100vw - 24px));
      padding: 0;
      border: 1px solid var(--cp-border);
      border-radius: .625rem;
      background: var(--cp-surface);
      color: var(--cp-text);
      box-shadow: var(--cp-shadow);
    }
    dialog::backdrop { background: rgba(0, 0, 0, .42); }
    .sync-dialog { padding: 22px; }
    .sync-dialog h2 { font-size: 20px; }
    .sync-dialog .hint { margin: 4px 0 16px; color: var(--cp-text-muted); font-size: 12px; line-height: 1.5; }
    .sync-dialog-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .check-row { display: flex; align-items: center; gap: 8px; color: var(--cp-text); }
    .check-row input { width: auto; min-height: auto; }
    .setup {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 24px;
      align-items: start;
      padding-top: 28px;
    }
    .setup-main { min-width: 0; }
    .setup-main > p { max-width: 590px; line-height: 1.65; }
    .panel {
      border: 1px solid var(--cp-border);
      border-radius: 16px;
      background: var(--cp-surface);
      box-shadow: 0 0 2px var(--cp-border), 0 1px 2px var(--cp-border);
    }
    .setup-panel { padding: 24px; }
    .step { display: none; }
    .step.active { display: block; animation: reveal .24s ease-out; }
    @keyframes reveal { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
    .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
    .mode-option {
      position: relative;
      min-height: 116px;
      padding: 18px;
      border: 2px solid var(--cp-border);
      border-radius: .625rem;
      background: var(--cp-surface-soft);
      text-align: left;
    }
    .mode-option.selected { border-color: var(--cp-accent); background: var(--cp-accent-soft); }
    .mode-number { display: block; color: var(--cp-accent); font: 700 34px Georgia, serif; }
    .field { display: grid; min-width: 0; gap: 6px; margin-bottom: 14px; }
    label { color: var(--cp-text-muted); font-size: 13px; font-weight: 650; }
    input, select {
      width: 100%;
      min-height: 42px;
      padding: 8px 11px;
      border: 1px solid var(--cp-border);
      border-radius: .625rem;
      outline: none;
      background: var(--cp-bg-elevated);
      color: var(--cp-text);
    }
    input:focus, select:focus { border-color: var(--cp-accent); box-shadow: 0 0 0 3px var(--cp-accent-soft); }
    input[type="date"] {
      display: block;
      width: -webkit-fill-available;
      min-width: 0;
      max-width: 100%;
    }
    .player-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    .setup-nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 20px; }
    .session-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    .session-title h2 { margin-bottom: 3px; }
    .session-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .summary-grid { display: grid; grid-template-columns: repeat(var(--players), minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
    .summary-card { padding: 15px; overflow: hidden; }
    .summary-card.leader { border-color: var(--cp-link); }
    .summary-card.last-place { border-color: var(--cp-danger); }
    .summary-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
    .summary-points { margin: 7px 0 2px; font: 700 24px Consolas, "Courier New", monospace; }
    .summary-points.positive { color: var(--cp-link); }
    .summary-points.negative { color: var(--cp-danger); }
    .summary-settlement { display: grid; gap: 4px; margin-top: 10px; color: var(--cp-text-muted); font-size: 12px; }
    .settlement-row { display: flex; justify-content: space-between; gap: 8px; }
    .settlement-row strong { color: var(--cp-text); font-family: Consolas, "Courier New", monospace; }
    .settlement-total { margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--cp-border); font-size: 14px; font-weight: 700; }
    .settlement-total strong { font-size: 22px; }
    .settlement-total.positive strong { color: var(--cp-link); }
    .settlement-total.negative strong { color: var(--cp-danger); }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: start; }
    .game-panel { overflow: hidden; }
    .panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--cp-border); }
    .panel-heading h3 { margin: 0; }
    .game-number { color: var(--cp-accent); font-family: Consolas, monospace; font-weight: 700; }
    .sitout-row { display: grid; grid-template-columns: 110px minmax(0, 230px); gap: 10px; align-items: center; padding: 14px 18px 0; }
    .sitout-row label { color: var(--cp-text); }
    .hako-row { display: grid; grid-template-columns: minmax(0, 230px) minmax(0, 1fr); gap: 10px; align-items: start; padding: 14px 18px 0; }
    .hako-row .field { margin-bottom: 0; }
    .hako-checks { display: grid; min-height: 42px; grid-template-columns: repeat(4, max-content); gap: 8px; align-items: center; }
    .hako-check { display: inline-flex; gap: 6px; align-items: center; padding: 8px 10px; border: 1px solid var(--cp-border); border-radius: .375rem; background: var(--cp-surface-soft); cursor: pointer; }
    .hako-check input { width: auto; margin: 0; }
    .score-grid { display: grid; grid-template-columns: repeat(var(--players), minmax(0, 1fr)); gap: 10px; padding: 18px; }
    .score-entry { min-width: 0; padding: 14px 12px; border: 1px solid var(--cp-border); border-radius: .625rem; background: var(--cp-surface-soft); }
    .score-entry.resting { opacity: .48; }
    .score-entry label { display: block; overflow: hidden; margin-bottom: 8px; color: var(--cp-text); text-overflow: ellipsis; white-space: nowrap; }
    .score-entry input { font-family: Consolas, "Courier New", monospace; font-size: 18px; font-weight: 700; text-align: right; }
    .score-entry input[readonly], .chip-entry input[readonly] { background: var(--cp-bg-elevated); color: var(--cp-text-muted); cursor: default; }
    .result-line { display: flex; justify-content: space-between; gap: 8px; min-height: 42px; padding-top: 10px; color: var(--cp-text-muted); font-size: 12px; }
    .result-line strong { display: block; margin-top: 2px; color: var(--cp-text); font: 700 16px Consolas, monospace; }
    .checkbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-top: 1px solid var(--cp-border); background: var(--cp-bg-elevated); }
    .total-state { display: flex; align-items: center; gap: 9px; font-weight: 700; }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--cp-warning); }
    .total-state.ok .status-dot { background: var(--cp-success); }
    .total-state.bad .status-dot { background: var(--cp-danger); }
    .total-value { font-family: Consolas, monospace; }
    .history-panel { width: 100%; min-width: 0; overflow: hidden; }
    .history-list { overflow-x: auto; }
    .empty { padding: 32px 18px; color: var(--cp-text-muted); text-align: center; }
    .history-table { width: 100%; min-width: 560px; border-collapse: collapse; table-layout: fixed; }
    .history-table th, .history-table td { padding: 10px 8px; border-right: 1px solid var(--cp-border); border-bottom: 1px solid var(--cp-border); text-align: center; }
    .history-table th:last-child, .history-table td:last-child { border-right: 0; }
    .history-table thead th { position: sticky; top: 0; z-index: 1; background: var(--cp-bg-elevated); color: var(--cp-text); font-size: 12px; }
    .history-table .game-cell { width: 94px; background: var(--cp-surface-soft); }
    .history-table .game-label { display: block; margin-bottom: 7px; color: var(--cp-accent); font-family: Consolas, monospace; }
    .history-tools { display: flex; align-items: center; justify-content: center; gap: 6px; }
    .history-edit { min-height: 30px; padding: 4px 9px; font-size: 12px; }
    .history-delete {
      width: 30px;
      height: 30px;
      padding: 0;
      border: 1px solid var(--cp-border);
      border-radius: .625rem;
      background: var(--cp-surface);
      color: var(--cp-danger);
      font-size: 18px;
      line-height: 1;
    }
    .history-result { min-width: 92px; }
    .history-rank { display: block; margin-bottom: 3px; color: var(--cp-text); font-weight: 700; }
    .history-rank.first { color: var(--cp-link); }
    .history-rank.fourth { color: var(--cp-danger); }
    .history-raw-score { display: block; color: var(--cp-text-muted); font: 12px Consolas, monospace; }
    .history-point { display: block; margin-top: 5px; color: var(--cp-text); font: 700 16px Consolas, monospace; }
    .history-resting { color: var(--cp-text-muted); }
    .history-actions { padding: 12px 16px; border-top: 1px solid var(--cp-border); }
    .settlement-panel { margin-bottom: 18px; overflow: hidden; }
    .settlement-content { padding: 18px; }
    .chip-grid { display: grid; grid-template-columns: repeat(var(--players), minmax(0, 1fr)); gap: 10px; }
    .chip-entry { min-width: 0; }
    .chip-entry label { display: block; overflow: hidden; margin-bottom: 6px; color: var(--cp-text); text-overflow: ellipsis; white-space: nowrap; }
    .chip-check { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }
    .archive { min-width: 0; margin-top: 24px; }
    #archiveSection { max-width: 100%; overflow: hidden; }
    .archive-table { width: 100%; border-collapse: collapse; }
    .archive-table th, .archive-table td { padding: 12px 16px; border-bottom: 1px solid var(--cp-border); text-align: left; }
    .archive-table th { color: var(--cp-text-muted); font-size: 12px; }
    .archive-table tr:last-child td { border-bottom: 0; }
    .archive-table button { color: var(--cp-link); }
    .archive-actions { display: flex; gap: 6px; }
    .archive-table .archive-delete { color: var(--cp-danger); }
    .archive-date { display: grid; gap: 4px; white-space: nowrap; }
    .archive-games { color: var(--cp-text-muted); font-size: 12px; }
    .archive-members, .archive-points { display: grid; gap: 3px; }
    .archive-member { overflow: hidden; line-height: 21px; text-overflow: ellipsis; white-space: nowrap; }
    .archive-point { font-family: Consolas, "Courier New", monospace; font-weight: 700; line-height: 21px; white-space: nowrap; }
    .archive-point.positive { color: var(--cp-link); }
    .archive-point.negative { color: var(--cp-danger); }
    .all-scores { overflow-x: auto; }
    .all-scores-toolbar { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--cp-border); }
    .all-scores-toolbar label { color: var(--cp-text-muted); font-size: 13px; font-weight: 700; }
    .all-scores-toolbar select { width: auto; min-width: 140px; }
    .all-scores-table { width: 100%; min-width: 720px; border-collapse: collapse; }
    .all-scores-table th, .all-scores-table td { padding: 11px 13px; border-bottom: 1px solid var(--cp-border); text-align: right; white-space: nowrap; }
    .all-scores-table th:first-child, .all-scores-table td:first-child { position: sticky; left: 0; z-index: 1; background: var(--cp-surface); text-align: left; }
    .all-scores-table thead th, .all-scores-table tfoot th, .all-scores-table tfoot td { color: var(--cp-text); font-weight: 700; }
    .all-scores-table .positive { color: var(--cp-link); }
    .all-scores-table .negative { color: var(--cp-danger); }
    .manual-panel { margin-top: 16px; padding: 18px; }
    .manual-panel h3 { margin-bottom: 16px; }
    .manual-head { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .manual-players { display: grid; grid-template-columns: 1fr 140px; gap: 10px; }
    .user-management { max-width: 640px; overflow: hidden; }
    .user-add { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: end; padding: 18px; border-bottom: 1px solid var(--cp-border); }
    .user-add .field { margin: 0; }
    .user-list { display: grid; }
    .user-row { display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 11px 18px; border-bottom: 1px solid var(--cp-border); }
    .user-row:last-child { border-bottom: 0; }
    .user-name { font-weight: 700; }
    .user-count { color: var(--cp-text-muted); font-size: 12px; }
    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 10;
      max-width: min(360px, calc(100vw - 40px));
      padding: 12px 16px;
      border: 1px solid var(--cp-border);
      border-radius: .625rem;
      background: var(--cp-panel-strong);
      color: var(--cp-text);
      box-shadow: var(--cp-shadow);
      transform: translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
    }
    .toast.show { transform: none; opacity: 1; }
    .hidden { display: none !important; }
    @media (max-width: 860px) {
      .setup, .workspace { grid-template-columns: 1fr; }
      .summary-grid, .score-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .chip-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .history-panel { order: 2; }
    }
    @media (max-width: 560px) {
      .shell { padding: 16px 12px; }
      .topbar, .session-header { align-items: flex-start; }
      .topbar { flex-wrap: wrap; gap: 10px; }
      .brand { flex: 0 0 auto; gap: 8px; }
      .brand-mark { width: 38px; height: 46px; font-size: 22px; }
      .brand-copy h1 { margin-top: 7px; font-size: 18px; white-space: nowrap; }
      #topActions { display: grid; flex: 1 0 100%; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
      #topActions .btn { min-height: 36px; padding: 7px 4px; font-size: 12px; }
      .session-actions { max-width: 180px; }
      .topbar { margin-bottom: 16px; }
      .brand-copy .muted { display: none; }
      .setup-panel { padding: 18px; }
      .mode-grid, .player-fields { grid-template-columns: 1fr; }
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .score-grid { grid-template-columns: 1fr; }
      .hako-row { grid-template-columns: 1fr 1fr; }
      .hako-checks { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hako-check { min-width: 0; }
      .chip-grid { grid-template-columns: 1fr 1fr; }
      .checkbar { align-items: stretch; flex-direction: column; }
      .checkbar .btn { width: 100%; }
      #archiveSection { overflow: visible; }
      #archiveSection > .archive { overflow: visible; }
      .archive-table, .archive-table tbody { display: block; width: 100%; }
      .archive-table { min-width: 0; }
      .archive-table thead { display: none; }
      .archive-table tr { display: grid; grid-template-columns: 86px minmax(0, 1fr) 78px; align-items: start; border-bottom: 1px solid var(--cp-border); }
      .archive-table tr:last-child { border-bottom: 0; }
      .archive-table td { min-width: 0; padding: 14px 8px; border-bottom: 0; }
      .archive-table td:first-child { padding-left: 12px; font-size: 13px; }
      .archive-table td:nth-child(3) { padding-right: 12px; text-align: right; }
      .archive-table td:last-child { grid-column: 1 / -1; padding: 0 12px 12px; }
      .archive-actions { justify-content: flex-end; }
      .manual-head { grid-template-columns: 1fr; }
      .user-add { grid-template-columns: 1fr; }
      .user-add .btn { width: 100%; }
      #sessionDate, #manualDate { width: -webkit-fill-available; min-width: 0; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">中</div>
        <div class="brand-copy">
          <h1>麻雀スコア帳</h1>
        </div>
      </div>
      <div class="actions" id="topActions">
        <button class="btn" id="showUserManagement" type="button">ユーザー管理</button>
        <button class="btn" id="showAllScores" type="button">全スコア</button>
        <button class="btn" id="pullSharedData" type="button">最新データ取得</button>
      </div>
    </header>

    <section id="setupView" class="setup">
      <div class="panel setup-panel">
        <div class="eyebrow">Score session</div>
        <h2>今日の卓をはじめる</h2>
        <p class="muted">参加人数、日付、メンバーを登録するとスコア入力を開始します。</p>
        <div id="modeStep" class="step active">
          <div class="eyebrow">Step 1</div>
          <h3>参加人数</h3>
          <div class="mode-grid">
            <button class="mode-option" type="button" data-mode="4"><span class="mode-number">4</span>人用</button>
            <button class="mode-option" type="button" data-mode="5"><span class="mode-number">5</span>人用</button>
          </div>
          <button class="btn primary" id="modeNext" type="button" disabled>次へ</button>
        </div>
        <div id="playersStep" class="step">
          <div class="eyebrow">Step 2</div>
          <h3>日付とプレイヤー</h3>
          <div class="field"><label for="sessionDate">日付</label><input id="sessionDate" type="date"></div>
          <div class="player-fields">
            <div class="field">
              <label for="pointRate">点数レート</label>
              <select id="pointRate"><option value="50">点5（×50）</option><option value="100">点10（×100）</option></select>
            </div>
          </div>
          <div id="playerFields" class="player-fields"></div>
          <datalist id="knownPlayers"></datalist>
          <div class="setup-nav">
            <button class="btn" id="setupBack" type="button">戻る</button>
            <button class="btn primary" id="startSession" type="button">開始</button>
          </div>
        </div>
      </div>

      <div class="setup-main">
        <div id="archiveSection" class="panel archive hidden">
          <div class="panel-heading"><h3>過去の記録</h3><button class="btn" id="showManualForm" type="button">簡易的に記録を追加する</button></div>
          <div class="archive" style="margin-top:0">
            <table class="archive-table">
              <thead><tr><th>日付・総ゲーム数</th><th>最終順位</th><th>最終ポイント</th><th></th></tr></thead>
              <tbody id="archiveBody"></tbody>
            </table>
          </div>
        </div>
        <section id="manualPanel" class="panel manual-panel hidden">
          <h3>過去の記録を追加</h3>
          <div class="manual-head">
            <div class="field"><label for="manualDate">日付</label><input id="manualDate" type="date"></div>
            <div class="field"><label for="manualMode">人数</label><select id="manualMode"><option value="4">4人</option><option value="5">5人</option></select></div>
            <div class="field"><label for="manualGames">総ゲーム数</label><input id="manualGames" type="number" min="0" step="1" inputmode="numeric"></div>
          </div>
          <div id="manualPlayers" class="manual-players"></div>
          <div class="setup-nav"><button class="btn" id="cancelManual" type="button">キャンセル</button><button class="btn primary" id="saveManual" type="button">追加</button></div>
        </section>
      </div>
    </section>

    <section id="userManagementView" class="hidden">
      <div class="session-header">
        <div class="session-title"><div class="eyebrow">Players</div><h2>ユーザー管理</h2></div>
        <button class="btn" id="closeUserManagement" type="button">戻る</button>
      </div>
      <section class="panel user-management">
        <div class="user-add">
          <div class="field">
            <label for="newUserName">新しいユーザー名</label>
            <input id="newUserName" type="text" maxlength="30" autocomplete="off" placeholder="名前を入力">
          </div>
          <button class="btn primary" id="addUser" type="button">追加</button>
        </div>
        <div class="panel-heading"><h3>既存ユーザー</h3><span class="muted" id="userCount"></span></div>
        <div id="userList" class="user-list"></div>
      </section>
    </section>

    <section id="allScoresView" class="hidden">
      <div class="session-header">
        <div class="session-title"><div class="eyebrow">Score archive</div><h2>全員のスコア</h2></div>
        <button class="btn" id="closeAllScores" type="button">戻る</button>
      </div>
      <section class="panel all-scores">
        <div class="all-scores-toolbar">
          <label for="allScoresPeriod">表示期間</label>
          <select id="allScoresPeriod"></select>
        </div>
        <table class="all-scores-table">
          <thead id="allScoresHead"></thead>
          <tbody id="allScoresBody"></tbody>
          <tfoot id="allScoresFoot"></tfoot>
        </table>
      </section>
    </section>

    <section id="scoreView" class="hidden">
      <div class="session-header">
        <div class="session-title"><div class="eyebrow" id="sessionMeta"></div><h2 id="sessionHeading"></h2></div>
        <div class="session-actions">
          <button class="btn hidden" id="openChipInput" type="button">チップ入力</button>
          <button class="btn" id="exitWithoutSaving" type="button">保存せず終了</button>
          <button class="btn" id="saveSession" type="button">保存</button>
          <button class="btn" id="finishSession" type="button">保存して終了</button>
        </div>
      </div>
      <div id="summaryGrid" class="summary-grid"></div>
      <section id="settlementPanel" class="panel settlement-panel hidden">
        <div class="panel-heading"><h3>チップ集計</h3><span class="muted">20枚原点</span></div>
        <div class="settlement-content">
          <div class="field"><label for="settlementChipRate">チップレート（1枚）</label><input id="settlementChipRate" type="number" min="1" step="50" inputmode="numeric" placeholder="例：500"></div>
          <div id="chipGrid" class="chip-grid"></div>
          <div class="chip-check">
            <span id="chipTotalMessage" class="muted"></span>
            <div class="actions">
              <button class="btn" id="cancelSettlement" type="button">破棄して閉じる</button>
              <button class="btn primary" id="confirmSettlement" type="button" disabled>チップを保存</button>
            </div>
          </div>
        </div>
      </section>
      <div class="workspace">
        <section class="panel game-panel">
          <div class="panel-heading"><h3>スコア入力</h3><span class="game-number" id="gameNumber"></span></div>
          <div id="sitoutRow" class="sitout-row hidden">
            <label for="sitoutPlayer">休み</label><select id="sitoutPlayer"></select>
          </div>
          <div class="hako-row">
            <div class="field"><label for="hakoPlus">ハコ+（1人につき+10.0）</label><select id="hakoPlus"></select></div>
            <div class="field"><label>ハコ-（1人につき-10.0）</label><div id="hakoMinus" class="hako-checks"></div></div>
          </div>
          <div id="scoreGrid" class="score-grid"></div>
          <div class="checkbar">
            <div id="totalState" class="total-state"><span class="status-dot"></span><span id="totalMessage">点数を入力</span><span class="total-value" id="totalValue"></span></div>
            <div class="actions"><button class="btn hidden" id="cancelGameEdit" type="button">編集を取消</button><button class="btn" id="clearScores" type="button">スコアをクリア</button><button class="btn primary" id="saveGame" type="button" disabled>ゲームを記録</button></div>
          </div>
        </section>
        <aside class="panel history-panel">
          <div class="panel-heading"><h3>ゲーム履歴</h3></div>
          <div id="historyList" class="history-list"></div>
        </aside>
      </div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "mahjong-scorebook-v1";
      const ACTIVE_SESSION_KEY = "mahjong-scorebook-active-session";
      const SUPABASE_URL = "https://qqzrvdscnwdmpdrqdqtz.supabase.co";
      const SUPABASE_KEY = "sb_publishable_KZgbYMI3wmd4KE2FVyW_Xg_TH04wI69";
      const SHARED_ROW_ID = "mahjong-scorebook";
      const DEFAULT_PLAYERS = ["吉田", "横山", "佐々木", "山田", "松岡"];
      const UMA = { 1: 40, 2: 10, 3: -10, 4: -20 };
      const numberFormat = new Intl.NumberFormat("ja-JP");
      const pointFormat = new Intl.NumberFormat("ja-JP", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
      const moneyFormat = new Intl.NumberFormat("ja-JP", { maximumFractionDigits: 0 });
      let store = loadStore();
      let setupMode = null;
      let activeSessionId = null;
      let toastTimer = null;
      let pendingArchiveDeleteId = null;
      let editingGameId = null;

      const byId = (id) => document.getElementById(id);
      const setupView = byId("setupView");
      const scoreView = byId("scoreView");
      const allScoresView = byId("allScoresView");
      const userManagementView = byId("userManagementView");
      const modeStep = byId("modeStep");
      const playersStep = byId("playersStep");

      function loadStore() {
        try {
          const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
          return parsed && Array.isArray(parsed.sessions)
            ? { ...parsed, players: Array.isArray(parsed.players) ? parsed.players : [] }
            : { sessions: [], players: [], updatedAt: null };
        } catch {
          return { sessions: [], players: [], updatedAt: null };
        }
      }

      function persist() {
        store.updatedAt = new Date().toISOString();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
      }

      function saveLocalStore() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
      }

      function normalizeSharedStore(value) {
        const data = value?.data || value;
        return data && Array.isArray(data.sessions)
          ? { sessions: data.sessions, players: Array.isArray(data.players) ? data.players : [], updatedAt: data.updatedAt || null }
          : null;
      }

      function supabaseHeaders() {
        return {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json"
        };
      }

      async function fetchLegacySharedData() {
        try {
          const response = await fetch(`data.json?ts=${Date.now()}`, { cache: "no-store" });
          if (!response.ok) return null;
          return normalizeSharedStore(await response.json());
        } catch {
          return null;
        }
      }

      async function getSharedData() {
        try {
          const response = await fetch(`${SUPABASE_URL}/rest/v1/shared_scores?id=eq.${encodeURIComponent(SHARED_ROW_ID)}&select=data`, {
            headers: supabaseHeaders(),
            cache: "no-store"
          });
          if (!response.ok) throw new Error(`read ${response.status}`);
          const rows = await response.json();
          const shared = normalizeSharedStore(rows[0]?.data);
          if (shared) return shared;
        } catch (error) {
          console.error(error);
        }
        return fetchLegacySharedData();
      }

      async function pullSharedStore() {
        showToast("最新データを確認しています");
        const shared = await getSharedData();
        if (!shared) {
          showToast("共有データが見つかりませんでした");
          return;
        }
        if (JSON.stringify(store.sessions) === JSON.stringify(shared.sessions)) {
          showToast("すでに最新です");
          return;
        }
        if (store.sessions.length && !confirm(`共有データ（${shared.sessions.length}件）でこの端末の記録を更新しますか？`)) return;
        store = shared;
        saveLocalStore();
        showSetup();
        showToast(`共有データ ${store.sessions.length}件を取得しました`);
      }

      async function pushSharedStore(silent = false) {
        try {
          const response = await fetch(`${SUPABASE_URL}/rest/v1/shared_scores?on_conflict=id`, {
            method: "POST",
            headers: { ...supabaseHeaders(), Prefer: "resolution=merge-duplicates,return=minimal" },
            body: JSON.stringify({ id: SHARED_ROW_ID, data: store, updated_at: new Date().toISOString() })
          });
          if (!response.ok) throw new Error(`write ${response.status}`);
          if (!silent) showToast("現在の記録を共有しました");
          return true;
        } catch (error) {
          console.error(error);
          if (!silent) showToast("共有に失敗しました。設定を確認してください");
          return false;
        }
      }

      function autoPushIfEnabled() {
        showToast("記録を保存しました。共有を更新しています");
        pushSharedStore(true).then((success) => showToast(success ? "共有データを更新しました" : "共有更新に失敗しました"));
        return true;
      }

      function createId() {
        return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function today() {
        const date = new Date();
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      }

      function formatDate(value) {
        const [year, month, day] = value.split("-");
        return `${year}/${month}/${day}`;
      }

      function getKnownPlayers() {
        const additionalPlayers = [...new Set([...(store.players || []), ...store.sessions.flatMap((session) => session.players)])]
          .filter((name) => !DEFAULT_PLAYERS.includes(name))
          .sort((a, b) => a.localeCompare(b, "ja"));
        return [...DEFAULT_PLAYERS, ...additionalPlayers];
      }

      function activeSession() {
        return store.sessions.find((session) => session.id === activeSessionId) || null;
      }

      function rankScores(scores) {
        return scores.map((score) => score === null ? null : 1 + scores.filter((other) => other !== null && other > score).length);
      }

      function pointFor(score, rank) {
        return score === null || !UMA[rank] ? 0 : (score - 30000) / 1000 + UMA[rank];
      }

      function calculateGame(scores) {
        const ranks = rankScores(scores);
        return { ranks, points: scores.map((score, index) => pointFor(score, ranks[index])) };
      }

      function sessionTotals(session) {
        if (Array.isArray(session.manualTotals)) return session.manualTotals;
        return session.players.map((_, playerIndex) => session.games.reduce((total, game) => total + game.points[playerIndex], 0));
      }

      function gameCount(session) {
        return Number.isInteger(session.totalGames) ? session.totalGames : session.games.length;
      }

      function pointRate(session) {
        return session.pointRate || 50;
      }

      function signedMoney(value) {
        return `${value > 0 ? "+" : ""}${moneyFormat.format(value)}`;
      }

      function chipSettlement(session, playerIndex) {
        const chipCount = session.chipCounts?.[playerIndex];
        return session.chipEnabled && Number.isFinite(chipCount) ? (chipCount - 20) * session.chipRate : 0;
      }

      function showToast(message) {
        const toast = byId("toast");
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
      }

      function showSetup() {
        activeSessionId = null;
        sessionStorage.removeItem(ACTIVE_SESSION_KEY);
        editingGameId = null;
        pendingArchiveDeleteId = null;
        setupView.classList.remove("hidden");
        scoreView.classList.add("hidden");
        allScoresView.classList.add("hidden");
        userManagementView.classList.add("hidden");
        byId("topActions").classList.remove("hidden");
        modeStep.classList.add("active");
        playersStep.classList.remove("active");
        setupMode = null;
        document.querySelectorAll(".mode-option").forEach((button) => button.classList.remove("selected"));
        byId("modeNext").disabled = true;
        byId("sessionDate").value = today();
        byId("pointRate").value = "50";
        byId("manualPanel").classList.add("hidden");
        byId("manualDate").value = today();
        renderArchive();
        renderKnownPlayers();
      }

      function showUserManagement() {
        setupView.classList.add("hidden");
        scoreView.classList.add("hidden");
        allScoresView.classList.add("hidden");
        userManagementView.classList.remove("hidden");
        byId("topActions").classList.add("hidden");
        byId("newUserName").value = "";
        renderUserList();
        byId("newUserName").focus();
      }

      function renderUserList() {
        const players = getKnownPlayers();
        byId("userCount").textContent = `${players.length}名`;
        byId("userList").replaceChildren(...players.map((name) => {
          const row = document.createElement("div");
          row.className = "user-row";
          const playerName = document.createElement("span");
          playerName.className = "user-name";
          playerName.textContent = name;
          const sessionCount = store.sessions.filter((session) => session.players.includes(name)).length;
          const count = document.createElement("span");
          count.className = "user-count";
          count.textContent = sessionCount ? `${sessionCount}回参加` : "未参加";
          row.append(playerName, count);
          return row;
        }));
      }

      function addUser() {
        const input = byId("newUserName");
        const name = input.value.trim();
        if (!name) {
          showToast("ユーザー名を入力してください");
          input.focus();
          return;
        }
        if (getKnownPlayers().includes(name)) {
          showToast("同じ名前のユーザーが登録されています");
          input.focus();
          return;
        }
        store.players = [...(store.players || []), name];
        persist();
        renderKnownPlayers();
        renderUserList();
        input.value = "";
        input.focus();
        showToast(`${name}さんを追加しました。共有を更新しています`);
        pushSharedStore(true).then((success) => showToast(success ? "ユーザーを共有しました" : "共有更新に失敗しました"));
      }

      function renderKnownPlayers() {
        byId("knownPlayers").replaceChildren(...getKnownPlayers().map((name) => {
          const option = document.createElement("option");
          option.value = name;
          return option;
        }));
      }

      function renderPlayerFields() {
        const fragment = document.createDocumentFragment();
        const knownPlayers = getKnownPlayers();
        for (let index = 0; index < setupMode; index += 1) {
          const field = document.createElement("div");
          field.className = "field";
          const label = document.createElement("label");
          label.htmlFor = `player-${index}`;
          label.textContent = `プレイヤー ${index + 1}`;
          const select = document.createElement("select");
          select.id = `player-${index}`;
          select.dataset.playerInput = "true";
          const placeholder = document.createElement("option");
          placeholder.value = "";
          placeholder.textContent = "プレイヤーを選択";
          select.append(placeholder, ...knownPlayers.map((name) => {
            const option = document.createElement("option");
            option.value = name;
            option.textContent = name;
            return option;
          }));
          select.addEventListener("change", updatePlayerChoices);
          field.append(label, select);
          fragment.append(field);
        }
        byId("playerFields").replaceChildren(fragment);
      }

      function updatePlayerChoices() {
        const inputs = [...document.querySelectorAll("[data-player-input]")];
        const knownPlayers = getKnownPlayers();
        inputs.forEach((input, index) => {
          const selectedElsewhere = new Set(inputs.filter((_, otherIndex) => otherIndex !== index).map((other) => other.value.trim()).filter(Boolean));
          const selected = input.value;
          const placeholder = document.createElement("option");
          placeholder.value = "";
          placeholder.textContent = "プレイヤーを選択";
          input.replaceChildren(placeholder, ...knownPlayers.filter((name) => name === selected || !selectedElsewhere.has(name)).map((name) => {
            const option = document.createElement("option");
            option.value = name;
            option.textContent = name;
            return option;
          }));
          input.value = selected;
        });
      }

      function renderArchive() {
        const section = byId("archiveSection");
        const body = byId("archiveBody");
        section.classList.remove("hidden");
        const sessions = [...store.sessions].sort((left, right) => right.date.localeCompare(left.date) || (right.createdAt || "").localeCompare(left.createdAt || ""));
        if (!sessions.length) {
          const row = document.createElement("tr");
          const cell = document.createElement("td");
          cell.colSpan = 4;
          cell.className = "empty";
          cell.textContent = "過去の記録はありません";
          row.append(cell);
          body.replaceChildren(row);
          return;
        }
        body.replaceChildren(...sessions.map((session) => {
          const row = document.createElement("tr");
          const dateCell = document.createElement("td");
          const dateDetails = document.createElement("div");
          dateDetails.className = "archive-date";
          const date = document.createElement("span");
          date.textContent = formatDate(session.date);
          const games = document.createElement("span");
          games.className = "archive-games";
          games.textContent = `${gameCount(session)}G`;
          dateDetails.append(date, games);
          dateCell.append(dateDetails);
          const membersCell = document.createElement("td");
          const memberList = document.createElement("div");
          memberList.className = "archive-members";
          const pointsCell = document.createElement("td");
          const pointList = document.createElement("div");
          pointList.className = "archive-points";
          const totals = sessionTotals(session);
          session.players
            .map((name, index) => ({ name, value: totals[index] || 0 }))
            .sort((left, right) => right.value - left.value)
            .forEach(({ name, value }, position) => {
            const member = document.createElement("span");
            member.className = "archive-member";
            const suffix = position === 0 ? "st" : position === 1 ? "nd" : position === 2 ? "rd" : "th";
            member.textContent = `${position + 1}${suffix} ${name}`;
            const point = document.createElement("span");
            point.className = `archive-point${value > 0 ? " positive" : value < 0 ? " negative" : ""}`;
            point.textContent = `${value > 0 ? "+" : ""}${pointFormat.format(value)}`;
            memberList.append(member);
            pointList.append(point);
            });
          membersCell.append(memberList);
          pointsCell.append(pointList);
          row.append(dateCell, membersCell, pointsCell);
          const actionCell = document.createElement("td");
          const actions = document.createElement("div");
          actions.className = "archive-actions";
          if (!Array.isArray(session.manualTotals)) {
            const openButton = document.createElement("button");
            openButton.type = "button";
            openButton.className = "btn";
            openButton.textContent = "開く";
            openButton.addEventListener("click", () => openSession(session.id));
            actions.append(openButton);
          }
          const deleteButton = document.createElement("button");
          deleteButton.type = "button";
          deleteButton.className = "btn archive-delete";
          deleteButton.textContent = pendingArchiveDeleteId === session.id ? "削除を確定" : "削除";
          deleteButton.addEventListener("click", () => requestArchiveDelete(session.id));
          actions.append(deleteButton);
          actionCell.append(actions);
          row.append(actionCell);
          return row;
        }));
      }

      function openSession(id) {
        activeSessionId = id;
        sessionStorage.setItem(ACTIVE_SESSION_KEY, id);
        editingGameId = null;
        setupView.classList.add("hidden");
        allScoresView.classList.add("hidden");
        userManagementView.classList.add("hidden");
        scoreView.classList.remove("hidden");
        byId("topActions").classList.add("hidden");
        renderSession();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function renderSession() {
        const session = activeSession();
        if (!session) return showSetup();
        if (!editingGameId) {
          byId("saveGame").textContent = "ゲームを記録";
          byId("cancelGameEdit").classList.add("hidden");
        }
        document.documentElement.style.setProperty("--players", session.mode);
        const chipMeta = session.chipEnabled ? ` · チップ ${numberFormat.format(session.chipRate)}/枚` : " · チップなし";
        byId("sessionMeta").textContent = `${formatDate(session.date)} · ${session.mode}人用 · 点${pointRate(session) === 100 ? 10 : 5}${chipMeta}`;
        byId("sessionHeading").textContent = session.players.join("・");
        byId("gameNumber").textContent = `${session.games.length + 1}G`;
        byId("openChipInput").classList.remove("hidden");
        byId("settlementPanel").classList.add("hidden");
        renderSummary(session);
        renderScoreInputs(session);
        renderHistory(session);
      }

      function renderAllScores() {
        const players = getKnownPlayers();
        const selectedPeriod = byId("allScoresPeriod").value || "all";
        const sessions = store.sessions
          .filter((session) => selectedPeriod === "all" || session.date.startsWith(`${selectedPeriod}-`))
          .sort((left, right) => left.date.localeCompare(right.date) || (left.createdAt || "").localeCompare(right.createdAt || ""));
        const header = document.createElement("tr");
        ["日付", ...players].forEach((label) => {
          const cell = document.createElement("th");
          cell.textContent = label;
          header.append(cell);
        });
        byId("allScoresHead").replaceChildren(header);
        byId("allScoresBody").replaceChildren(...sessions.map((session) => {
          const totals = sessionTotals(session);
          const values = new Map(session.players.map((name, index) => [name, totals[index]]));
          const row = document.createElement("tr");
          const date = document.createElement("td");
          date.textContent = `${formatDate(session.date)} (${gameCount(session)}G)`;
          row.append(date, ...players.map((name) => {
            const cell = document.createElement("td");
            const value = values.get(name);
            if (Number.isFinite(value)) {
              cell.className = value > 0 ? "positive" : value < 0 ? "negative" : "";
              cell.textContent = `${value > 0 ? "+" : ""}${pointFormat.format(value)}`;
            } else {
              cell.textContent = "−";
            }
            return cell;
          }));
          return row;
        }));
        const totalRow = document.createElement("tr");
        const totalLabel = document.createElement("th");
        totalLabel.textContent = "総合計";
        totalRow.append(totalLabel, ...players.map((name) => {
          const value = sessions.reduce((total, session) => {
            const index = session.players.indexOf(name);
            return total + (index >= 0 ? sessionTotals(session)[index] : 0);
          }, 0);
          const cell = document.createElement("td");
          cell.className = value > 0 ? "positive" : value < 0 ? "negative" : "";
          cell.textContent = `${value > 0 ? "+" : ""}${pointFormat.format(value)}`;
          return cell;
        }));
        const averageRow = document.createElement("tr");
        const averageLabel = document.createElement("th");
        averageLabel.textContent = "平均";
        averageRow.append(averageLabel, ...players.map((name) => {
          const participated = sessions.filter((session) => session.players.includes(name));
          const value = participated.length ? participated.reduce((total, session) => total + sessionTotals(session)[session.players.indexOf(name)], 0) / participated.length : null;
          const cell = document.createElement("td");
          if (Number.isFinite(value)) {
            cell.className = value > 0 ? "positive" : value < 0 ? "negative" : "";
            cell.textContent = `${value > 0 ? "+" : ""}${pointFormat.format(value)}`;
          } else {
            cell.textContent = "−";
          }
          return cell;
        }));
        byId("allScoresFoot").replaceChildren(totalRow, averageRow);
      }

      function showAllScores() {
        const period = byId("allScoresPeriod");
        const previous = period.value || "all";
        const years = [...new Set(store.sessions.map((session) => session.date.slice(0, 4)))].sort((left, right) => right.localeCompare(left));
        period.replaceChildren(...[["all", "全対戦"], ...years.map((year) => [year, `${year}年`])].map(([value, label]) => {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = label;
          return option;
        }));
        period.value = [...period.options].some((option) => option.value === previous) ? previous : "all";
        setupView.classList.add("hidden");
        scoreView.classList.add("hidden");
        allScoresView.classList.remove("hidden");
        byId("topActions").classList.add("hidden");
        renderAllScores();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function renderSummary(session) {
        const totals = sessionTotals(session);
        const leader = totals.length ? Math.max(...totals) : 0;
        const lastPlace = totals.length ? Math.min(...totals) : 0;
        byId("summaryGrid").replaceChildren(...session.players.map((name, index) => {
          const card = document.createElement("article");
          const positionClass = session.games.length && totals[index] === leader ? " leader" : session.games.length && totals[index] === lastPlace ? " last-place" : "";
          card.className = `panel summary-card${positionClass}`;
          const playerName = document.createElement("div");
          playerName.className = "summary-name";
          playerName.textContent = name;
          const points = document.createElement("div");
          points.className = `summary-points ${totals[index] > 0 ? "positive" : totals[index] < 0 ? "negative" : ""}`;
          points.textContent = `${totals[index] > 0 ? "+" : ""}${pointFormat.format(totals[index])}`;
          const settlement = document.createElement("div");
          settlement.className = "summary-settlement";
          const gameSettlement = totals[index] * pointRate(session);
          const chips = chipSettlement(session, index);
          const totalSettlement = gameSettlement + chips;
          const pointRow = document.createElement("div");
          pointRow.className = "settlement-row";
          pointRow.innerHTML = `<span>点数清算</span><strong>${signedMoney(gameSettlement)}</strong>`;
          const chipRow = document.createElement("div");
          chipRow.className = "settlement-row";
          chipRow.innerHTML = `<span>チップ清算</span><strong>${signedMoney(chips)}</strong>`;
          const totalRow = document.createElement("div");
          totalRow.className = `settlement-row settlement-total ${totalSettlement > 0 ? "positive" : totalSettlement < 0 ? "negative" : ""}`;
          totalRow.innerHTML = `<span>合計清算</span><strong>${signedMoney(totalSettlement)}</strong>`;
          settlement.append(pointRow, chipRow, totalRow);
          card.append(playerName, points, settlement);
          return card;
        }));
      }

      function renderManualPlayers() {
        const count = Number(byId("manualMode").value);
        const knownPlayers = getKnownPlayers();
        byId("manualPlayers").replaceChildren(...Array.from({ length: count }, (_, index) => {
          const name = document.createElement("select");
          name.dataset.manualName = String(index);
          const placeholder = document.createElement("option");
          placeholder.value = "";
          placeholder.textContent = `プレイヤー ${index + 1}`;
          name.append(placeholder, ...knownPlayers.map((playerName) => {
            const option = document.createElement("option");
            option.value = playerName;
            option.textContent = playerName;
            return option;
          }));
          name.addEventListener("change", updateManualPlayerChoices);
          const point = document.createElement("input");
          point.dataset.manualPoint = String(index);
          point.type = "text";
          point.inputMode = "text";
          point.pattern = "-?[0-9]+([.][0-9]+)?";
          point.placeholder = index === count - 1 ? "自動計算" : "最終ポイント";
          point.readOnly = index === count - 1;
          point.addEventListener("input", updateManualFinalPoint);
          const fragment = document.createDocumentFragment();
          fragment.append(name, point);
          return fragment;
        }));
      }

      function updateManualPlayerChoices() {
        const selects = [...document.querySelectorAll("[data-manual-name]")];
        const knownPlayers = getKnownPlayers();
        selects.forEach((select, index) => {
          const selected = select.value;
          const selectedElsewhere = new Set(selects.filter((_, otherIndex) => otherIndex !== index).map((other) => other.value).filter(Boolean));
          const placeholder = document.createElement("option");
          placeholder.value = "";
          placeholder.textContent = `プレイヤー ${index + 1}`;
          select.replaceChildren(placeholder, ...knownPlayers.filter((name) => name === selected || !selectedElsewhere.has(name)).map((name) => {
            const option = document.createElement("option");
            option.value = name;
            option.textContent = name;
            return option;
          }));
          select.value = selected;
        });
      }

      function updateManualFinalPoint() {
        const inputs = [...document.querySelectorAll("[data-manual-point]")];
        const finalInput = inputs.at(-1);
        if (!finalInput) return;
        const preceding = inputs.slice(0, -1).map((input) => input.value.trim() === "" ? null : Number(input.value));
        finalInput.value = preceding.every(Number.isFinite)
          ? String(Number((-preceding.reduce((sum, value) => sum + value, 0)).toFixed(10)))
          : "";
      }

      function showManualForm() {
        byId("manualDate").value = today();
        byId("manualGames").value = "";
        byId("manualMode").value = "4";
        renderManualPlayers();
        byId("manualPanel").classList.remove("hidden");
        byId("manualPanel").scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function saveManualRecord() {
        const date = byId("manualDate").value;
        const mode = Number(byId("manualMode").value);
        const totalGames = Number(byId("manualGames").value);
        const players = [...document.querySelectorAll("[data-manual-name]")].map((input) => input.value.trim());
        const pointInputs = [...document.querySelectorAll("[data-manual-point]")];
        const totals = pointInputs.map((input) => input.value === "" ? null : Number(input.value));
        if (!date || !Number.isInteger(totalGames) || totalGames < 0 || players.some((name) => !name) || totals.some((value) => !Number.isFinite(value))) {
          showToast("日付、総ゲーム数、全員の名前と最終ポイントを入力してください");
          return;
        }
        if (new Set(players).size !== mode) {
          showToast("プレイヤー名が重複しています");
          return;
        }
        if (Math.abs(totals.reduce((sum, value) => sum + value, 0)) > 1e-9) {
          showToast("最終ポイントの合計が0になるように入力してください");
          return;
        }
        store.sessions.push({ id: createId(), mode, date, players, manualTotals: totals, totalGames, pointRate: 50, chipEnabled: false, chipRate: 0, games: [], createdAt: new Date().toISOString() });
        persist();
        byId("manualPanel").classList.add("hidden");
        renderArchive();
        renderKnownPlayers();
        if (!autoPushIfEnabled()) showToast("過去の記録を追加しました");
      }

      function renderScoreInputs(session) {
        const sitoutRow = byId("sitoutRow");
        const sitoutSelect = byId("sitoutPlayer");
        byId("hakoPlus").replaceChildren();
        byId("hakoMinus").replaceChildren();
        sitoutRow.classList.toggle("hidden", session.mode !== 5);
        sitoutSelect.replaceChildren(...session.players.map((name, index) => {
          const option = document.createElement("option");
          option.value = index;
          option.textContent = name;
          return option;
        }));
        if (session.mode === 5) sitoutSelect.value = String(session.games.length % 5);
        byId("hakoPlus").onchange = updateHakoOptions;

        const entries = session.players.map((name, index) => {
          const entry = document.createElement("div");
          entry.className = "score-entry";
          entry.dataset.entry = String(index);
          const label = document.createElement("label");
          label.htmlFor = `score-${index}`;
          label.textContent = name;
          const input = document.createElement("input");
          input.id = `score-${index}`;
          input.dataset.scoreInput = String(index);
          input.type = "text";
          input.inputMode = "text";
          input.pattern = "-?[0-9]*";
          input.placeholder = "0";
          input.addEventListener("input", updatePreview);
          const result = document.createElement("div");
          result.className = "result-line";
          result.innerHTML = `<span>順位<strong data-rank="${index}">−</strong></span><span>ポイント<strong data-point="${index}">−</strong></span>`;
          entry.append(label, input, result);
          return entry;
        });
        byId("scoreGrid").replaceChildren(...entries);
        sitoutSelect.onchange = updateSitout;
        updateSitout();
      }

      function updateHakoOptions() {
        const session = activeSession();
        const restingIndex = session.mode === 5 ? Number(byId("sitoutPlayer").value) : -1;
        const plus = byId("hakoPlus");
        const minus = byId("hakoMinus");
        const previousPlus = plus.value;
        const previousMinus = new Set([...minus.querySelectorAll("input:checked")].map((input) => input.value));
        const buildOptions = () => {
          const none = document.createElement("option");
          none.value = "";
          none.textContent = "なし";
          return [none, ...session.players.flatMap((name, index) => {
            if (index === restingIndex || previousMinus.has(String(index))) return [];
            const option = document.createElement("option");
            option.value = index;
            option.textContent = name;
            return [option];
          })];
        };
        plus.replaceChildren(...buildOptions());
        plus.value = [...plus.options].some((option) => option.value === previousPlus) ? previousPlus : "";
        const checks = session.players.flatMap((name, index) => {
          if (index === restingIndex || String(index) === plus.value) return [];
          const label = document.createElement("label");
          label.className = "hako-check";
          const input = document.createElement("input");
          input.type = "checkbox";
          input.value = index;
          input.checked = previousMinus.has(String(index));
          input.addEventListener("change", updateHakoOptions);
          label.append(input, document.createTextNode(name));
          return [label];
        });
        minus.replaceChildren(...checks);
        updatePreview();
      }

      function selectedHakoMinus() {
        return [...byId("hakoMinus").querySelectorAll("input:checked")].map((input) => Number(input.value));
      }

      function hakoAdjustments(playerCount) {
        const adjustments = Array(playerCount).fill(0);
        const plus = byId("hakoPlus").value;
        const minus = selectedHakoMinus();
        if (plus !== "") adjustments[Number(plus)] += 10 * minus.length;
        minus.forEach((index) => { adjustments[index] -= 10; });
        return adjustments;
      }

      function updateSitout() {
        const session = activeSession();
        const restingIndex = session.mode === 5 ? Number(byId("sitoutPlayer").value) : -1;
        document.querySelectorAll("[data-score-input]").forEach((input) => {
          const isResting = Number(input.dataset.scoreInput) === restingIndex;
          input.disabled = isResting;
          if (isResting) input.value = "";
          input.closest(".score-entry").classList.toggle("resting", isResting);
        });
        updateHakoOptions();
      }

      function currentScores() {
        return [...document.querySelectorAll("[data-score-input]")].map((input) => {
          if (input.disabled || input.value.trim() === "") return null;
          return Number(input.value);
        });
      }

      function updateFinalScoreInput() {
        const inputs = [...document.querySelectorAll("[data-score-input]")];
        inputs.forEach((input) => { input.readOnly = false; });
        const activeInputs = inputs.filter((input) => !input.disabled);
        const finalInput = activeInputs.at(-1);
        if (!finalInput) return;
        finalInput.readOnly = true;
        const precedingScores = activeInputs.slice(0, -1).map((input) => input.value.trim() === "" ? null : Number(input.value));
        finalInput.value = precedingScores.every(Number.isFinite)
          ? String(100000 - precedingScores.reduce((sum, score) => sum + score, 0))
          : "";
      }

      function updatePreview() {
        updateFinalScoreInput();
        const scores = currentScores();
        const activeScores = scores.filter((score) => score !== null);
        const expectedCount = 4;
        const complete = activeScores.length === expectedCount && activeScores.every(Number.isFinite);
        const total = activeScores.reduce((sum, score) => sum + score, 0);
        const calculated = complete ? calculateGame(scores) : { ranks: [], points: [] };
        const adjustments = hakoAdjustments(scores.length);

        scores.forEach((score, index) => {
          const rank = byId("scoreGrid").querySelector(`[data-rank="${index}"]`);
          const point = byId("scoreGrid").querySelector(`[data-point="${index}"]`);
          if (score === null || !complete) {
            rank.textContent = "−";
            point.textContent = "−";
          } else {
            rank.textContent = `${calculated.ranks[index]}位`;
            const value = calculated.points[index] + adjustments[index];
            point.textContent = `${value > 0 ? "+" : ""}${pointFormat.format(value)}`;
          }
        });

        const state = byId("totalState");
        state.classList.remove("ok", "bad");
        byId("totalValue").textContent = activeScores.length ? numberFormat.format(total) : "";
        if (!complete) {
          byId("totalMessage").textContent = "3名分を入力すると最後の点数を自動計算";
        } else if (total === 100000) {
          state.classList.add("ok");
          byId("totalMessage").textContent = "点数チェック OK";
        } else {
          state.classList.add("bad");
          byId("totalMessage").textContent = `再確認（差額 ${numberFormat.format(total - 100000)}）`;
        }
        byId("saveGame").disabled = !complete || total !== 100000;
      }

      function saveGame() {
        const session = activeSession();
        const scores = currentScores();
        const activeScores = scores.filter((score) => score !== null);
        if (activeScores.length !== 4 || activeScores.reduce((sum, score) => sum + score, 0) !== 100000) {
          showToast("入力点数の合計を再確認してください");
          return;
        }
        const { ranks, points } = calculateGame(scores);
        const hakoPlus = byId("hakoPlus").value === "" ? null : Number(byId("hakoPlus").value);
        const hakoMinus = selectedHakoMinus();
        const adjustments = hakoAdjustments(scores.length);
        const adjustedPoints = points.map((point, index) => point + adjustments[index]);
        const existingIndex = editingGameId ? session.games.findIndex((game) => game.id === editingGameId) : -1;
        const existing = existingIndex >= 0 ? session.games[existingIndex] : null;
        const game = { id: existing?.id || createId(), scores, ranks, points: adjustedPoints, hakoPlus, hakoMinus, createdAt: existing?.createdAt || new Date().toISOString() };
        if (existingIndex >= 0) session.games[existingIndex] = game;
        else session.games.push(game);
        const wasEditing = existingIndex >= 0;
        editingGameId = null;
        persist();
        renderSession();
        showToast(wasEditing ? "ゲーム記録を更新しました。共有を更新しています" : `${session.games.length}Gを記録しました。共有を更新しています`);
        pushSharedStore(true).then((success) => showToast(success ? "共有データを更新しました" : "共有更新に失敗しました"));
      }

      function clearScores() {
        const inputs = [...document.querySelectorAll("[data-score-input]")];
        inputs.forEach((input) => { input.value = ""; });
        updatePreview();
        inputs.find((input) => !input.disabled && !input.readOnly)?.focus();
        showToast("スコアをクリアしました");
      }

      function renderHistory(session) {
        const list = byId("historyList");
        if (!session.games.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "記録はまだありません";
          list.replaceChildren(empty);
          return;
        }
        const table = document.createElement("table");
        table.className = "history-table";
        const head = document.createElement("thead");
        const headRow = document.createElement("tr");
        const gameHead = document.createElement("th");
        gameHead.textContent = "ゲーム";
        headRow.append(gameHead, ...session.players.map((name) => {
          const playerHead = document.createElement("th");
          playerHead.textContent = name;
          return playerHead;
        }));
        head.append(headRow);
        const body = document.createElement("tbody");
        session.games.forEach((game, gameOffset) => {
          const gameIndex = gameOffset + 1;
          const row = document.createElement("tr");
          const gameCell = document.createElement("th");
          gameCell.className = "game-cell";
          const title = document.createElement("strong");
          title.className = "game-label";
          title.textContent = `${gameIndex}G`;
          const tools = document.createElement("div");
          tools.className = "history-tools";
          const editButton = document.createElement("button");
          editButton.type = "button";
          editButton.className = "btn history-edit";
          editButton.textContent = "編集";
          editButton.addEventListener("click", () => editGame(game.id));
          const deleteButton = document.createElement("button");
          deleteButton.type = "button";
          deleteButton.className = "history-delete";
          deleteButton.title = `${gameIndex}Gを削除`;
          deleteButton.setAttribute("aria-label", `${gameIndex}Gを削除`);
          deleteButton.textContent = "×";
          deleteButton.addEventListener("click", () => deleteGame(game.id));
          tools.append(editButton, deleteButton);
          gameCell.append(title, tools);
          row.append(gameCell);
          session.players.forEach((name, index) => {
            const result = document.createElement("td");
            result.className = "history-result";
            if (game.scores[index] === null) {
              result.classList.add("history-resting");
              result.textContent = "休み";
            } else {
              const rank = document.createElement("span");
              rank.className = `history-rank${game.ranks[index] === 1 ? " first" : game.ranks[index] === 4 ? " fourth" : ""}`;
              rank.textContent = `${game.ranks[index]}位`;
              const rawScore = document.createElement("span");
              rawScore.className = "history-raw-score";
              rawScore.textContent = numberFormat.format(game.scores[index]);
              const point = document.createElement("strong");
              point.className = "history-point";
              point.textContent = pointFormat.format(game.points[index]);
              result.append(rank, rawScore, point);
            }
            row.append(result);
          });
          body.append(row);
        });
        table.append(head, body);
        list.replaceChildren(table);
      }

      function editGame(gameId) {
        const session = activeSession();
        const game = session?.games.find((item) => item.id === gameId);
        if (!session || !game) return;
        editingGameId = gameId;
        const restingIndex = game.scores.findIndex((score) => score === null);
        if (session.mode === 5 && restingIndex >= 0) byId("sitoutPlayer").value = String(restingIndex);
        updateSitout();
        document.querySelectorAll("[data-score-input]").forEach((input, index) => {
          input.value = game.scores[index] === null ? "" : String(game.scores[index]);
        });
        const hakoMinus = new Set((Array.isArray(game.hakoMinus) ? game.hakoMinus : [game.hakoMinus]).filter(Number.isInteger).map(String));
        byId("hakoMinus").querySelectorAll("input").forEach((input) => { input.checked = hakoMinus.has(input.value); });
        updateHakoOptions();
        byId("hakoPlus").value = game.hakoPlus ?? "";
        updateHakoOptions();
        byId("saveGame").textContent = "ゲームを更新";
        byId("cancelGameEdit").classList.remove("hidden");
        updatePreview();
        byId("scoreGrid").scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function cancelGameEdit() {
        editingGameId = null;
        renderSession();
        showToast("編集を取り消しました");
      }

      function deleteGame(gameId) {
        const session = activeSession();
        if (!session) return;
        const gameIndex = session.games.findIndex((game) => game.id === gameId);
        if (gameIndex < 0) return;
        if (!window.confirm(`${gameIndex + 1}Gのゲーム記録を削除しますか？`)) return;
        session.games.splice(gameIndex, 1);
        persist();
        renderSession();
        showToast("ゲーム記録を削除しました。共有を更新しています");
        pushSharedStore(true).then((success) => showToast(success ? "共有データを更新しました" : "共有更新に失敗しました"));
      }

      function requestArchiveDelete(sessionId) {
        if (pendingArchiveDeleteId !== sessionId) {
          pendingArchiveDeleteId = sessionId;
          renderArchive();
          showToast("もう一度押すと記録を削除します");
          return;
        }
        store.sessions = store.sessions.filter((session) => session.id !== sessionId);
        pendingArchiveDeleteId = null;
        persist();
        renderArchive();
        renderKnownPlayers();
        if (!autoPushIfEnabled()) showToast("過去の記録を削除しました");
      }

      function openSettlement() {
        const session = activeSession();
        if (!session) return;
        const panel = byId("settlementPanel");
        panel.classList.remove("hidden");
        byId("settlementChipRate").value = session.chipRate > 0 ? session.chipRate : "";
        byId("chipGrid").replaceChildren(...session.players.map((name, index) => {
          const field = document.createElement("div");
          field.className = "chip-entry";
          const label = document.createElement("label");
          label.htmlFor = `chip-${index}`;
          label.textContent = name;
          const input = document.createElement("input");
          input.id = `chip-${index}`;
          input.type = "text";
          input.inputMode = "text";
          input.pattern = "-?[0-9]*";
          input.placeholder = "20";
          if (Number.isFinite(session.chipCounts?.[index])) input.value = session.chipCounts[index];
          input.addEventListener("input", updateChipPreview);
          field.append(label, input);
          return field;
        }));
        updateChipPreview();
        panel.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function updateChipPreview() {
        const session = activeSession();
        const chipRate = Number(byId("settlementChipRate").value);
        const inputs = [...byId("chipGrid").querySelectorAll("input")];
        const expected = session.players.length * 20;
        const finalInput = inputs.at(-1);
        if (finalInput) {
          finalInput.readOnly = true;
          const precedingCounts = inputs.slice(0, -1).map((input) => input.value.trim() === "" ? null : Number(input.value));
          finalInput.value = precedingCounts.every(Number.isInteger)
            ? String(expected - precedingCounts.reduce((sum, count) => sum + count, 0))
            : "";
        }
        const counts = inputs.map((input) => input.value === "" ? null : Number(input.value));
        const complete = counts.length === session.players.length && counts.every(Number.isInteger);
        const total = counts.reduce((sum, count) => sum + (count || 0), 0);
        byId("chipTotalMessage").textContent = complete
          ? `合計 ${total}枚（${total === expected ? "OK" : `差分 ${total - expected}枚`}）`
          : `最後の1名は自動計算（合計 ${expected}枚）`;
        byId("confirmSettlement").disabled = !complete || total !== expected || !Number.isFinite(chipRate) || chipRate <= 0;
      }

      function cancelSettlement() {
        byId("settlementChipRate").value = "";
        byId("chipGrid").replaceChildren();
        byId("settlementPanel").classList.add("hidden");
        showToast("チップ入力を破棄しました");
      }

      function confirmSettlement() {
        const session = activeSession();
        const chipRate = Number(byId("settlementChipRate").value);
        const counts = [...byId("chipGrid").querySelectorAll("input")].map((input) => Number(input.value));
        if (!Number.isFinite(chipRate) || chipRate <= 0 || counts.reduce((sum, count) => sum + count, 0) !== session.players.length * 20) return;
        session.chipEnabled = true;
        session.chipRate = chipRate;
        session.chipCounts = counts;
        persist();
        renderSession();
        renderSummary(session);
        autoPushIfEnabled();
        showToast("チップを保存しました");
      }

      function saveSession() {
        if (!activeSession()) return;
        persist();
        autoPushIfEnabled();
      }

      function exitWithoutSaving() {
        showSetup();
        showToast("保存せず終了しました");
      }

      function saveAndExit() {
        const session = activeSession();
        if (!session) return;
        if (session.chipEnabled && !Array.isArray(session.chipCounts)) {
          openSettlement();
          showToast("持ちチップを入力して保存してください");
          return;
        }
        session.settledAt = new Date().toISOString();
        persist();
        showSetup();
        if (!autoPushIfEnabled()) showToast("記録を保存しました");
      }

      function startSession() {
        const date = byId("sessionDate").value;
        const rate = Number(byId("pointRate").value);
        const players = [...document.querySelectorAll("[data-player-input]")].map((input) => input.value.trim());
        if (!date || players.some((name) => !name)) {
          showToast("日付とプレイヤー名をすべて入力してください");
          return;
        }
        if (new Set(players).size !== players.length) {
          showToast("プレイヤー名が重複しています");
          return;
        }
        const session = { id: createId(), mode: setupMode, date, players, pointRate: rate, chipEnabled: false, chipRate: 0, games: [], createdAt: new Date().toISOString() };
        store.sessions.push(session);
        persist();
        openSession(session.id);
      }

      document.querySelectorAll(".mode-option").forEach((button) => button.addEventListener("click", () => {
        setupMode = Number(button.dataset.mode);
        document.querySelectorAll(".mode-option").forEach((item) => item.classList.toggle("selected", item === button));
        byId("modeNext").disabled = false;
      }));
      byId("modeNext").addEventListener("click", () => {
        renderPlayerFields();
        modeStep.classList.remove("active");
        playersStep.classList.add("active");
      });
      byId("setupBack").addEventListener("click", () => {
        playersStep.classList.remove("active");
        modeStep.classList.add("active");
      });
      byId("startSession").addEventListener("click", startSession);
      byId("showManualForm").addEventListener("click", showManualForm);
      byId("manualMode").addEventListener("change", renderManualPlayers);
      byId("cancelManual").addEventListener("click", () => byId("manualPanel").classList.add("hidden"));
      byId("saveManual").addEventListener("click", saveManualRecord);
      byId("saveGame").addEventListener("click", saveGame);
      byId("clearScores").addEventListener("click", clearScores);
      byId("cancelGameEdit").addEventListener("click", cancelGameEdit);
      byId("settlementChipRate").addEventListener("input", updateChipPreview);
      byId("cancelSettlement").addEventListener("click", cancelSettlement);
      byId("confirmSettlement").addEventListener("click", confirmSettlement);
      byId("openChipInput").addEventListener("click", openSettlement);
      byId("exitWithoutSaving").addEventListener("click", exitWithoutSaving);
      byId("saveSession").addEventListener("click", saveSession);
      byId("finishSession").addEventListener("click", saveAndExit);
      byId("pullSharedData").addEventListener("click", pullSharedStore);
      byId("showUserManagement").addEventListener("click", showUserManagement);
      byId("closeUserManagement").addEventListener("click", showSetup);
      byId("addUser").addEventListener("click", addUser);
      byId("newUserName").addEventListener("keydown", (event) => {
        if (event.key === "Enter") addUser();
      });
      byId("showAllScores").addEventListener("click", showAllScores);
      byId("allScoresPeriod").addEventListener("change", renderAllScores);
      byId("closeAllScores").addEventListener("click", showSetup);

      async function initialize() {
        if ("serviceWorker" in navigator && location.protocol !== "file:") {
          navigator.serviceWorker.register("./sw.js").catch((error) => console.error(error));
        }
        const hadLocal = Boolean(localStorage.getItem(STORAGE_KEY));
        if (!hadLocal || store.sessions.length === 0) {
          const shared = await getSharedData();
          if (shared && shared.sessions.length > 0) {
            store = shared;
            saveLocalStore();
          }
        }
        const savedSessionId = sessionStorage.getItem(ACTIVE_SESSION_KEY);
        if (savedSessionId && store.sessions.some((session) => session.id === savedSessionId)) openSession(savedSessionId);
        else showSetup();
      }

      initialize();
    })();
  </script>
</body>
</html>
